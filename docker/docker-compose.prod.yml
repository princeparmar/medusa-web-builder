# Medusa Web Builder — production catalog app (postgres + web only)
#
# No worker / redis / shops scaffolding. Admin registers npm packages;
# the public site lists them.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mwb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mwb}
      POSTGRES_DB: ${POSTGRES_DB:-medusa_web_builder}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mwb} -d ${POSTGRES_DB:-medusa_web_builder}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mwb}:${POSTGRES_PASSWORD:-mwb}@postgres:5432/${POSTGRES_DB:-medusa_web_builder}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "${MWB_WEB_PORT:-8020}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mwb}:${POSTGRES_PASSWORD:-mwb}@postgres:5432/${POSTGRES_DB:-medusa_web_builder}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://app.vyaparnext.com}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
